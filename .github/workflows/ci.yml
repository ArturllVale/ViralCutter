name: CI

on:
  push:
    branches: [ main, dev, master, 'fix/*', 'feat/*' ]
  pull_request:
    branches: [ main, dev, master ]
jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy ffmpeg-python tqdm deep-translator yt-dlp google-genai psutil

      - name: Compile and Lint Check
        run: |
          python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('**/*.py', recursive=True)]"

      - name: Run Scan i18n
        run: |
          python i18n/scan_i18n.py

      - name: Run Test Suite
        run: |
          pytest -v -s
